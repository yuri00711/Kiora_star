<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3eef3">
    <title>かきもの編集 · Kiora</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="write.css?v=20261108-1">
    <link rel="stylesheet" href="kiora/kiora-dock.css?v=20260922-1">
    <link rel="stylesheet" href="kiora-pop.css?v=20261110-1">
    <script defer src="kiora-ja.js?v=20261113-1"></script>
</head>
<body data-page="writing">
    <header class="write-nav">
        <button id="write-back" type="button">← 返回</button>
        <a href="index.html">KIORA.SPACE</a>
        <span id="save-state">確認中…</span>
    </header>

    <p id="write-gate-status" class="write-gate-status">正在确认管理员身份……</p>

    <main id="write-editor" class="write-shell" hidden>
        <header class="write-heading">
            <p id="write-mode">かきもの編集</p>
            <h1 id="write-page-title">新しい文章</h1>
        </header>

        <section id="draft-recovery" class="draft-recovery" hidden>
            <p>检测到未保存的草稿，是否恢复？</p>
            <div>
                <button id="restore-draft" type="button">恢复草稿</button>
                <button id="discard-draft" type="button">放弃草稿</button>
            </div>
        </section>

        <form id="write-form" class="write-form">
            <div class="write-fields-primary">
                <label>タイトル<input id="write-title" type="text" required maxlength="240"></label>
                <label>サブタイトル / あらすじ<input id="write-subtitle" type="text"></label>
                <label>短い抜粋<textarea id="write-excerpt" rows="3"></textarea></label>
            </div>

            <div class="write-meta-grid">
                <label>日付<input id="write-date" type="date" required></label>
                <label>分類<select id="write-category" required>
                    <option value="game_review">ゲーム感想</option>
                    <option value="essay">随筆</option>
                    <option value="dream">夢の文章</option>
                </select></label>
                <label id="write-game-field" hidden>RELATED GAME
                    <select id="write-game">
                        <option value="">関連づけない</option>
                    </select>
                    <small>仅用于游戏感想。保存后可从对应 Games 档案双向打开。</small>
                </label>
                <label>タグ<input id="write-tags" type="text" placeholder="読点区切り"></label>
                <label>並び順<input id="write-sort" type="number"></label>
                <label class="write-wide">カバー画像URL<input id="write-cover" type="url" placeholder="https://..."></label>
                <label class="write-wide">カバー画像をアップロード<input id="write-cover-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><small>最大 5MB</small></label>
                <label class="write-check"><input id="write-pinned" type="checkbox"> 上に固定</label>
                <label class="write-check"><input id="write-public" type="checkbox" checked> 公開する</label>
            </div>

            <section class="body-editor">
                <div class="editor-toolbar" role="toolbar" aria-label="Markdown 格式工具">
                    <button type="button" data-command="undo" title="撤销">↶</button>
                    <button type="button" data-command="redo" title="重做">↷</button>
                    <button type="button" data-prefix="# " title="标题">H1</button>
                    <button type="button" data-prefix="## " title="二级标题">H2</button>
                    <button type="button" data-wrap="**" title="粗体"><strong>B</strong></button>
                    <button type="button" data-wrap="*" title="斜体"><em>I</em></button>
                    <button type="button" data-wrap="~~" title="删除线"><s>S</s></button>
                    <button type="button" data-prefix="> " title="引用">❯</button>
                    <button type="button" data-prefix="- " title="箇条書き">• リスト</button>
                    <button type="button" data-prefix="1. " title="番号付きリスト">1. リスト</button>
                    <button type="button" data-command="link" title="リンク">リンク</button>
                    <button type="button" data-wrap="`" title="行内コード">コード</button>
                    <button type="button" data-command="rule" title="分隔线">—</button>
                    <button id="toggle-preview" type="button">プレビュー</button>
                </div>
                <textarea id="write-body" rows="24" required spellcheck="true" placeholder="从这里开始写……"></textarea>
                <div id="write-preview" class="write-preview" hidden></div>
                <div class="writing-stats"><span id="word-count">0 字</span><span id="reading-time">约 1 分钟阅读</span></div>
            </section>

            <p id="write-message" class="write-message" role="status"></p>
            <div class="write-actions">
                <button id="save-writing" class="write-save" type="submit">保存</button>
                <button id="delete-writing" class="write-delete" type="button" hidden>削除</button>
            </div>
        </form>
    </main>

    <div id="mobile-write-toolbar" class="mobile-write-toolbar" aria-label="移动端写作工具栏" hidden>
        <button type="button" data-prefix="# ">H</button>
        <button type="button" data-wrap="**"><strong>B</strong></button>
        <button type="button" data-wrap="*"><em>I</em></button>
        <button type="button" data-prefix="> ">引用</button>
        <button type="button" data-prefix="- ">リスト</button>
        <button type="button" data-command="link">リンク</button>
        <button type="button" data-command="preview">見る</button>
        <button type="button" data-command="save">保存</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js?v=20260920-1"></script>
    <script src="article-common.js?v=20260917-3"></script>
    <script src="navigation-state.js?v=20261109-3"></script>
    <script src="write.js?v=20261109-1"></script>
    <script src="kiora/context-broker.js?v=20260921-3"></script>
    <script src="kiora/page-adapters.js?v=20260921-3"></script>
    <script src="kiora/kiora-dock.js?v=20260922-1"></script>
</body>
</html>
