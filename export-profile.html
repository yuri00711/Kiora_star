<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>わたしのこと · Kiora</title>
    <link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="settings-editor.css">
    <link rel="stylesheet" href="kiora/kiora-dock.css?v=20260922-1">
    <link rel="stylesheet" href="kiora-pop.css?v=20261113-2">
    <script defer src="kiora-ja.js?v=20261113-1"></script>
</head>
<body data-page="about">
    <nav class="settings-nav"><button id="settings-back" type="button">← プロフィールへ</button><span id="settings-save-state" class="settings-save-state">確認中…</span></nav>
    <main class="settings-shell export-settings-shell">
        <p id="settings-gate" class="settings-gate" role="status">編集権限を確認しています…</p>
        <section id="export-editor" hidden>
            <header class="settings-header"><p class="settings-eyebrow">プロフィール / 書き出し設定</p><h1>わたしのこと</h1><p>空欄の項目には現在のプロフィールを使います。保存するまではデータを書き換えません。</p></header>
            <div class="export-editor-layout">
                <form id="export-form" class="settings-card">
                    <section class="export-editor-section"><h2>プロフィール表示の上書き</h2><div class="settings-fields">
                        <label>表示名<input id="export-name" type="text" placeholder="空欄ならプロフィール名を使用"></label>
                        <label>サブタイトル<input id="export-subtitle" type="text" placeholder="空欄ならプロフィールのひとことを使用"></label>
                        <label>短い紹介文<textarea id="export-bio" rows="4" placeholder="空欄なら短い紹介文を使用"></textarea></label>
                        <label>自己紹介文<textarea id="export-about" rows="4" placeholder="空欄なら自己紹介文を使用"></textarea></label>
                        <label>書き出し用アイコンURL<input id="export-avatar" type="url" placeholder="空欄なら現在のアイコンを使用"></label>
                        <label>書き出し用アイコンをアップロード<input id="export-avatar-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label>
                        <button id="export-avatar-default" type="button" class="avatar-mode">恢复使用当前头像</button>
                    </div></section>
                    <section class="export-editor-section"><h2>各項目の表示文</h2><div class="settings-fields">
                        <label>好きな作品<textarea id="export-fandoms" rows="4" placeholder="1行ずつ：名前 | 説明。空欄ならプロフィールを使用"></textarea></label>
                        <label>お気に入り<textarea id="export-favorites" rows="4" placeholder="1行ずつ：名前 | 説明。空欄ならプロフィールを使用"></textarea></label>
                        <label>苦手なもの / NG<textarea id="export-boundaries" rows="3" placeholder="1行ずつ：名前 | 説明。空欄ならプロフィールを使用"></textarea></label>
                        <label>乙女ゲームの好み<textarea id="export-otome" rows="3" placeholder="空欄なら現在の属性バランスを使用"></textarea></label>
                        <label>いま遊んでいる<textarea id="export-currently" rows="2" placeholder="空欄なら現在のゲーム設定を使用"></textarea></label>
                        <label>自由帳<textarea id="export-free" rows="3" placeholder="空欄ならプロフィールの自由帳を使用"></textarea></label>
                    </div></section>
                    <section class="export-editor-section"><h2>表示する項目</h2><div id="visibility-grid" class="visibility-grid">
                        <label><input type="checkbox" data-visibility="avatar">显示头像</label><label><input type="checkbox" data-visibility="name">显示名字</label><label><input type="checkbox" data-visibility="subtitle">显示副标题</label><label><input type="checkbox" data-visibility="bio">显示简介</label><label><input type="checkbox" data-visibility="fandoms">显示坑 / Fandoms</label><label><input type="checkbox" data-visibility="favorites">显示推角</label><label><input type="checkbox" data-visibility="boundaries">显示雷点</label><label><input type="checkbox" data-visibility="otome_profile">显示日乙属性</label><label><input type="checkbox" data-visibility="currently_playing">显示 Currently Playing</label><label><input type="checkbox" data-visibility="free_space">显示 Free Space</label><label><input type="checkbox" data-visibility="updated">显示更新时间</label>
                    </div></section>
                    <div class="settings-actions"><button class="primary" type="submit">書き出し設定を保存</button><button id="export-reset" type="button">プロフィールの初期値に戻す</button></div><p id="settings-message" class="settings-message" role="status"></p>
                </form>
                <aside class="export-preview-column"><p class="export-preview-title">書き出しプレビュー</p><div id="export-preview" class="export-preview-paper"></div></aside>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260920-1"></script><script src="article-common.js"></script><script src="navigation-state.js?v=20261109-3"></script><script src="export-profile.js?v=20261109-1"></script>
    <script src="kiora/context-broker.js?v=20260921-3"></script>
    <script src="kiora/page-adapters.js?v=20260921-3"></script>
    <script src="kiora/kiora-dock.js?v=20260922-1"></script>
</body>
</html>
