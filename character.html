<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Character Record · Kiora</title>
    <meta name="description" content="Kiora character archive record.">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="game.css?v=20261109-4">
    <link rel="stylesheet" href="kiora/kiora-dock.css?v=20260922-1">
</head>
<body class="character-record-page">
    <div class="game-sky" aria-hidden="true"></div>
    <div class="game-starfall" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="game-orbits" aria-hidden="true"><span></span><span></span></div>

    <nav class="game-detail-nav" aria-label="Character navigation">
        <a id="character-back" href="game-record.html">← BACK TO GAME RECORD</a>
        <a href="index.html">KIORA.SPACE</a>
    </nav>

    <main class="game-detail-shell character-detail-shell">
        <p id="character-status" class="game-detail-status" role="status">Loading character record…</p>
        <article id="character-detail" class="character-detail character-record-sheet" hidden>
            <header class="character-detail-header">
                <figure id="character-image-frame" class="character-detail-image-frame" hidden>
                    <img id="character-image" alt="" loading="eager">
                </figure>
                <div class="character-detail-heading">
                    <p id="character-index" class="game-detail-kicker">CHARACTER RECORD</p>
                    <p class="character-game-context">FROM <a id="character-game-link" href="games.html"><span id="character-game-title">GAME ARCHIVE</span> →</a></p>
                    <h1 id="character-name"></h1>
                    <p id="character-subtitle" class="game-detail-original" hidden></p>
                    <div class="character-primary-actions">
                        <div class="character-rating-focus"><span>MY RATING</span><strong id="character-rating"></strong></div>
                        <a id="character-edit" class="character-edit-record" href="games.html" hidden>EDIT IMPRESSION</a>
                    </div>
                </div>
            </header>

            <section id="character-review-section" class="game-detail-section game-note-section" hidden>
                <div class="game-detail-section-heading">
                    <div><p class="game-detail-label">MY IMPRESSION</p><span>WHAT REMAINED AFTER THIS ROUTE</span></div>
                </div>
                <div id="character-review" class="game-detail-reading"></div>
            </section>

            <footer class="game-detail-footer">
                <a id="character-back-bottom" href="game-record.html">← RETURN TO GAME RECORD</a>
            </footer>
        </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js?v=20260920-1"></script>
    <script src="article-common.js?v=20260916-2"></script>
    <script src="navigation-state.js?v=20261109-2"></script>
    <script src="character.js?v=20261108-1"></script>
    <script src="kiora/context-broker.js?v=20260921-3"></script>
    <script src="kiora/page-adapters.js?v=20260921-3"></script>
    <script src="kiora/kiora-dock.js?v=20260922-1"></script>
</body>
</html>
