<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ゲームの全記録 · Kiora</title>
    <meta name="description" content="Kiora private game record and character archive.">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="game.css?v=20261109-5">
    <link rel="stylesheet" href="game-repo.css?v=20260917-4">
    <link rel="stylesheet" href="kiora/kiora-dock.css?v=20260922-1">
    <link rel="stylesheet" href="kiora-pop.css?v=20261113-2">
    <script defer src="kiora-ja.js?v=20261113-1"></script>
</head>
<body data-page="games" class="game-record-page">
    <div class="game-sky" aria-hidden="true"></div>
    <div class="game-starfall" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="game-orbits" aria-hidden="true"><span></span><span></span></div>

    <nav class="game-detail-nav" aria-label="Game record navigation">
        <a id="record-back" href="game.html">← ゲームへ戻る</a>
        <a href="index.html">KIORA.SPACE</a>
    </nav>

    <main class="game-detail-shell game-full-record-shell">
        <p id="record-status" class="game-detail-status" role="status">ゲームの全記録を読み込んでいます…</p>

        <article id="full-game-record" class="game-full-record game-archive-sheet" hidden>
            <header class="game-record-masthead">
                <div>
                    <p id="record-archive-number" class="game-detail-kicker">記録</p>
                    <h1 id="record-title"></h1>
                    <p id="record-original" class="game-detail-original" hidden></p>
                </div>
                <dl class="game-record-summary">
                    <div><dt>評価</dt><dd id="record-rating"></dd></div>
                    <div id="record-played-fact" hidden><dt>プレイした日</dt><dd id="record-played"></dd></div>
                </dl>
            </header>

            <nav id="record-section-index" class="record-section-index" aria-label="Full record sections" hidden></nav>

            <section id="record-description-section" class="game-detail-section" hidden>
                <p class="game-detail-label">ゲームについて</p>
                <div id="record-description" class="game-detail-reading"></div>
            </section>

            <section id="record-note-section" class="game-detail-section game-note-section" hidden>
                <div class="game-detail-section-heading">
                    <div><p class="game-detail-label">わたしの記録</p><span>ゲームメモ / 個人的な感想</span></div>
                </div>
                <div id="record-note" class="game-detail-reading"></div>
            </section>

            <section id="record-characters-section" class="game-detail-section">
                <div class="game-detail-section-heading">
                    <div><p class="game-detail-label">キャラクター記録</p><span>このゲームのキャラクターたち</span></div>
                    <span id="record-character-count">00 人</span>
                </div>
                <div id="record-character-list" class="game-character-list"></div>
                <p id="record-character-empty" class="game-record-empty" hidden>キャラクター記録はまだありません。</p>
            </section>

            <section id="record-writing-section" class="game-detail-section game-related-writing-section" hidden>
                <div class="game-detail-section-heading">
                    <div><p class="game-detail-label">かきもの / 余韻</p><span>このゲームに結びついた文章</span></div>
                    <span id="record-writing-count">00 篇</span>
                </div>
                <div id="record-writing-list" class="game-related-writing-list"></div>
            </section>

            <section id="record-links-section" class="game-detail-section game-links-section" hidden>
                <div class="game-detail-section-heading">
                    <div><p class="game-detail-label">リンク</p><span>公式サイト / ストア</span></div>
                </div>
                <div id="record-links" class="game-detail-links"></div>
            </section>

            <footer class="game-detail-footer">
                <a id="record-back-bottom" href="game.html">← ゲームへ戻る</a>
                <time id="record-updated"></time>
            </footer>
        </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js?v=20260920-1"></script>
    <script src="article-common.js?v=20260916-3"></script>
    <script src="navigation-state.js?v=20261109-3"></script>
    <script src="game-record.js?v=20261108-2"></script>
    <script src="game-repo.js?v=20260917-4"></script>
    <script src="kiora/context-broker.js?v=20260921-3"></script>
    <script src="kiora/page-adapters.js?v=20260921-3"></script>
    <script src="kiora/kiora-dock.js?v=20260922-1"></script>
</body>
</html>
