<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>いま遊んでいる · Kiora</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="settings-editor.css?v=20260916-1">
    <link rel="stylesheet" href="kiora/kiora-dock.css?v=20260922-1">
    <link rel="stylesheet" href="kiora-pop.css?v=20261113-2">
    <script defer src="kiora-ja.js?v=20261113-1"></script>
</head>
<body data-page="about">
    <nav class="settings-nav"><button id="settings-back" type="button">← プロフィールへ</button><span id="settings-save-state" class="settings-save-state">確認中…</span></nav>
    <main class="settings-shell">
        <p id="settings-gate" class="settings-gate" role="status">編集権限を確認しています…</p>
        <section id="currently-editor" hidden>
            <header class="settings-header"><p class="settings-eyebrow">プロフィール / いま遊んでいる</p><h1>いま遊んでいる</h1><p>ゲーム記録と結びつけることも、表示文だけを自由に書くこともできます。</p></header>
            <form id="currently-form" class="settings-card">
                <div class="settings-fields">
                    <label>ゲームと関連づける<select id="currently-game"><option value="">関連づけない</option></select></label>
                    <label>表示タイトル<input id="currently-title" type="text" maxlength="160" placeholder="空欄なら関連ゲームのタイトルを使います"></label>
                    <label>サブタイトル<input id="currently-subtitle" type="text" maxlength="200"></label>
                    <div class="settings-grid">
                        <label>状態<select id="currently-status"><option value="">表示しない</option><option value="playing">プレイ中</option><option value="replaying">再プレイ中</option><option value="completed">クリア済み</option><option value="paused">休止中</option></select></label>
                        <label>ひとことメモ<input id="currently-note" type="text" maxlength="260"></label>
                    </div>
                    <div class="settings-tag-field">
                        <p class="settings-tag-label">タグ / キーワード</p>
                        <div id="currently-tag-list" class="settings-tag-list" aria-live="polite"></div>
                        <div class="settings-tag-entry">
                            <input id="currently-tag-entry" type="text" maxlength="120" autocomplete="off" aria-label="新しいタグ" placeholder="タグを入力">
                            <button id="currently-add-tag" type="button">＋ タグを追加</button>
                        </div>
                    </div>
                </div>
                <div class="settings-actions"><button class="primary" type="submit">現在のゲームを保存</button><button id="currently-clear" type="button">設定をクリア</button></div>
                <p id="settings-message" class="settings-message" role="status"></p>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260920-1"></script><script src="article-common.js"></script><script src="navigation-state.js?v=20261109-3"></script><script src="currently-playing.js?v=20261109-1"></script>
    <script src="kiora/context-broker.js?v=20260921-3"></script>
    <script src="kiora/page-adapters.js?v=20260921-3"></script>
    <script src="kiora/kiora-dock.js?v=20260922-1"></script>
</body>
</html>
