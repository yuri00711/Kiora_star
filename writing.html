    <main class="standalone-page standalone-writing">
        <header class="standalone-page-heading">
            <p>KIORA.SPACE / WRITING</p>
            <h1>Writing</h1>
        </header>
<section
        class="content-section writing-section reveal"
        id="writing"
    >

        <h2>
            WRITING
        </h2>


        <div class="writing-grid">

            <article class="writing-card writing-category-game">
                <div class="writing-card-mark">✦</div>
                <p class="writing-card-index">01 / AFTERGLOW</p>
                <div class="writing-card-note">
                    <span>游戏感想</span>
                    <span data-admin-slot="add-writing-game_review"></span>
                </div>
                <div class="writing-article-list" data-writing-list="game_review"></div>
                <button class="writing-view-all" type="button" data-view-writing-category="game_review">VIEW ALL →</button>
            </article>

            <article class="writing-card writing-category-essay">
                <div class="writing-card-mark">☾</div>
                <p class="writing-card-index">02 / MOON NOTES</p>
                <div class="writing-card-note">
                    <span>随笔</span>
                    <span data-admin-slot="add-writing-essay"></span>
                </div>
                <div class="writing-article-list" data-writing-list="essay"></div>
                <button class="writing-view-all" type="button" data-view-writing-category="essay">VIEW ALL →</button>
            </article>

            <article class="writing-card writing-category-dream">
                <div class="writing-card-mark">◇</div>
                <p class="writing-card-index">03 / DREAM LETTERS</p>
                <div class="writing-card-note">
                    <span>梦向创作</span>
                    <span data-admin-slot="add-writing-dream"></span>
                </div>
                <div class="writing-article-list" data-writing-list="dream"></div>
                <button class="writing-view-all" type="button" data-view-writing-category="dream">VIEW ALL →</button>
            </article>

        </div>

    </section>

    <footer class="standalone-footer">
