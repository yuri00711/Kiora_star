<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Game Archive · Kiora</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="game.css?v=20260915-2">
</head>
<body>
    <div class="game-sky" aria-hidden="true"></div>
    <div class="game-starfall" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="game-orbits" aria-hidden="true"><span></span><span></span></div>

    <nav class="game-detail-nav" aria-label="Game navigation">
        <button id="game-back" type="button">← BACK TO ARCHIVE</button>
        <a href="index.html">KIORA.SPACE</a>
    </nav>

    <main class="game-detail-shell">
        <p id="game-detail-status" class="game-detail-status" role="status">Loading archive…</p>

        <article id="game-detail" class="game-detail" hidden>
            <header class="game-record">
                <div class="game-record-heading">
                    <p id="game-detail-archive-number" class="game-detail-kicker">ARCHIVE</p>
                    <h1 id="game-detail-title"></h1>
                    <p id="game-detail-original" class="game-detail-original" hidden></p>
                </div>

                <figure class="game-detail-cover-frame">
                    <span class="game-cover-index" aria-hidden="true">CELESTIAL<br>COLLECTION</span>
                    <img id="game-detail-cover" class="game-detail-cover" alt="" loading="eager" hidden>
                    <div id="game-detail-cover-placeholder" class="game-detail-cover-placeholder" aria-hidden="true">✦</div>
                    <figcaption>PRIVATE GAME ARCHIVE</figcaption>
                </figure>

                <div class="game-record-dossier">
                    <dl class="game-detail-facts">
                        <div id="game-rating-fact"><dt>RATING</dt><dd id="game-detail-rating"></dd></div>
                        <div id="game-status-fact" hidden><dt>STATUS</dt><dd id="game-detail-play-status"></dd></div>
                        <div id="game-platform-fact" hidden><dt>PLATFORM</dt><dd id="game-detail-platforms"></dd></div>
                        <div id="game-favorite-fact" hidden><dt>FAVORITE LEVEL</dt><dd id="game-detail-favorite"></dd></div>
                        <div id="game-date-fact" hidden><dt>PLAYED</dt><dd id="game-detail-date"></dd></div>
                    </dl>

                    <div id="game-note-preview" class="game-note-preview" hidden>
                        <p class="game-detail-label">PERSONAL RECORD</p>
                        <p id="game-note-preview-text"></p>
                        <a href="#game-note-section">READ FULL NOTE →</a>
                    </div>

                    <p id="game-detail-keywords-label" class="game-detail-keywords-label" hidden>KEYWORDS</p>
                    <div id="game-detail-tags" class="game-detail-tags" hidden></div>

                    <div id="game-admin-actions" class="game-admin-actions" hidden>
                        <a id="game-edit-record" href="games.html">EDIT RECORD</a>
                        <a id="game-add-character" href="games.html">＋ ADD CHARACTER</a>
                    </div>
                </div>
            </header>

            <section id="game-description-section" class="game-detail-section" hidden>
                <p class="game-detail-label">INTRODUCTION</p>
                <div id="game-detail-description" class="game-detail-reading"></div>
            </section>

            <section id="game-note-section" class="game-detail-section game-note-section" hidden>
                <div class="game-detail-section-heading">
                    <div><p class="game-detail-label">PERSONAL RECORD</p><span>GAME NOTE / PRIVATE IMPRESSION</span></div>
                </div>
                <div id="game-detail-note" class="game-detail-reading"></div>
            </section>

            <section id="game-links-section" class="game-detail-section game-links-section" hidden>
                <div class="game-detail-section-heading">
                    <div><p class="game-detail-label">LINKS</p><span>OFFICIAL / STORE</span></div>
                </div>
                <div id="game-detail-links" class="game-detail-links"></div>
            </section>

            <section id="game-characters-section" class="game-detail-section" hidden>
                <div class="game-detail-section-heading">
                    <div><p class="game-detail-label">CHARACTER ARCHIVE</p><span>ROUTES IN THIS CONSTELLATION</span></div>
                    <span id="game-character-count"></span>
                </div>
                <div id="game-character-list" class="game-character-list"></div>
            </section>

            <footer class="game-detail-footer">
                <button id="game-back-bottom" type="button">← RETURN TO GAMES</button>
                <time id="game-detail-updated"></time>
            </footer>
        </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="article-common.js"></script>
    <script src="game.js?v=20260915-3"></script>
</body>
</html>
