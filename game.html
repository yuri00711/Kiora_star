<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Game Archive · Kiora</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div class="game-detail-stars" aria-hidden="true"></div>

    <nav class="game-detail-nav" aria-label="Game navigation">
        <button id="game-back" type="button">← BACK TO GAMES</button>
        <a href="index.html">KIORA.SPACE</a>
    </nav>

    <main class="game-detail-shell">
        <p id="game-detail-status" class="game-detail-status" role="status">Loading archive…</p>

        <article id="game-detail" class="game-detail" hidden>
            <header class="game-detail-hero">
                <figure class="game-detail-cover-frame">
                    <img id="game-detail-cover" alt="" loading="eager" hidden>
                    <div id="game-detail-cover-placeholder" class="game-detail-cover-placeholder" aria-hidden="true">✦</div>
                    <figcaption>PRIVATE GAME ARCHIVE</figcaption>
                </figure>

                <div class="game-detail-heading">
                    <p class="game-detail-kicker">GAMES / FIELD NOTE</p>
                    <h1 id="game-detail-title"></h1>
                    <p id="game-detail-original" class="game-detail-original" hidden></p>
                    <div id="game-detail-tags" class="game-detail-tags" hidden></div>

                    <dl class="game-detail-facts">
                        <div id="game-rating-fact"><dt>RATING</dt><dd id="game-detail-rating"></dd></div>
                        <div id="game-status-fact" hidden><dt>STATUS</dt><dd id="game-detail-play-status"></dd></div>
                        <div id="game-date-fact" hidden><dt>PLAYED</dt><dd id="game-detail-date"></dd></div>
                    </dl>
                </div>
            </header>

            <section id="game-description-section" class="game-detail-section" hidden>
                <p class="game-detail-label">INTRODUCTION</p>
                <div id="game-detail-description" class="game-detail-reading"></div>
            </section>

            <section id="game-note-section" class="game-detail-section game-note-section" hidden>
                <p class="game-detail-label">MY NOTE</p>
                <div id="game-detail-note" class="game-detail-reading"></div>
            </section>

            <section id="game-characters-section" class="game-detail-section" hidden>
                <div class="game-detail-section-heading">
                    <p class="game-detail-label">CHARACTER ARCHIVE</p>
                    <span id="game-character-count"></span>
                </div>
                <div id="game-character-list" class="game-character-list"></div>
            </section>

            <footer class="game-detail-footer">
                <button id="game-back-bottom" type="button">← RETURN TO GAMES</button>
                <time id="game-detail-updated"></time>
            </footer>
        </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="article-common.js"></script>
    <script src="game.js"></script>
</body>
</html>
